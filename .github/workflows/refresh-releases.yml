name: Refresh on new releases

# Checks every hour whether any project in src/data/projects.ts has a new
# stable GitHub release. When one does, it runs deploy.yml, which rebuilds
# GitHub Pages and Cloudflare Pages (azimulkabir.com). App repositories can
# also send a repository_dispatch event of type "app-released" to skip the wait.

on:
  schedule:
    - cron: '23 * * * *'
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no release changed
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: refresh-releases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read latest releases
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > releases.txt
          for repo in $(grep -oE "repo: '[^']+'" src/data/projects.ts | cut -d"'" -f2 | sort -u); do
            # Same rule as src/lib/github.ts: newest published, non-draft, non-prerelease release.
            if ! tag=$(gh api "repos/$repo/releases?per_page=100" \
              --jq '[.[] | select(.draft | not) | select(.prerelease | not) | select(.published_at)] | sort_by(.published_at) | last | .tag_name // ""'); then
              # Don't rebuild on a half-read list; the next run will try again.
              echo "::warning::Could not read releases for $repo"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$repo $tag" | tee -a releases.txt
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum releases.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # A cache entry per set of versions: a hit means the site was already rebuilt for them.
      - name: Check whether these versions were already deployed
        id: seen
        if: steps.releases.outputs.ok == 'true'
        uses: actions/cache/restore@v6
        with:
          path: releases.txt
          key: deployed-releases-${{ steps.releases.outputs.hash }}
          lookup-only: true

      # deploy.yml rebuilds GitHub Pages and asks Cloudflare Pages to rebuild azimulkabir.com.
      - name: Rebuild the site
        if: (steps.releases.outputs.ok == 'true' && steps.seen.outputs.cache-hit != 'true') || inputs.force || github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Remember deployed versions
        if: steps.releases.outputs.ok == 'true' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: releases.txt
          key: deployed-releases-${{ steps.releases.outputs.hash }}
